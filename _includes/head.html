<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% assign meta_description = page.description | default: site.description | strip_html | strip_newlines %}
<title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
<meta name="description" content="{{ meta_description | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="{% if page.collection %}article{% else %}website{% endif %}">
<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ meta_description | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="theme-color" content="#0b1119">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
